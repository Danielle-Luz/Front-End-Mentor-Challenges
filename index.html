<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maison Soleil</title>
  <link rel="stylesheet" href="./styles/globals.css" />
  <link rel="stylesheet" href="./styles/header/index.css" />
</head>
<body>
  <aside class="menu">
    <header class="header">
      <img src="./assets/images/logo.svg" alt="Maison Soleil logo, containing the name of the company and the icon of a yellow sun" />
      <button class="header__menu-button" aria-label="Open menu">
        <img class="header__close-icon--closed" src="./assets/images/icon-close.svg" alt="Close menu icon, an X" />
        <img class="header__menu-icon" src="./assets/images/icon-menu.svg" alt="Menu icon, three horizontal lines" />
      </button>
    </header>
    <nav class="menu__nav" aria-label="Menu navigation">
      <ul class="menu__list">
        <li class="menu__button">
          <img src="./assets/images/icon-bed.svg" alt="" />
          <a href="#stay">Your stay</a>
          <span class="menu__badge">1</span>
        </li>
        <li class="menu__button">
          <img src="./assets/images/icon-house.svg" alt="" />
          <a href="#house">The house</a>
          <span class="menu__badge">2</span>
        </li>
        <li class="menu__button">
          <img src="./assets/images/icon-pin.svg" alt="" />
          <a href="#town">Around town</a>
          <span class="menu__badge">3</span>
        </li>
        <li class="menu__button">
          <img src="./assets/images/icon-breakfast-outline.svg" alt="" />
          <a href="#breakfast">Breakfast</a>
          <span class="menu__badge">4</span>
        </li>
        <li class="menu__button">
          <img src="./assets/images/icon-mail.svg" alt="" />
          <a href="#message">Messages</a>
          <span class="menu__badge">5</span>
        </li>
      </ul>
    </nav>
  </aside>
  <section class="banner">
    <div class="banner__presentation">
      <div class="banner__booking-status">
        <p>Booking</p>
        <span>.</span>
        <p>Confirmed</p>
      </div>
      <h1 class="banner__title"">Bienvenue, Lucia</h1>
    </div>
    <div class="banner__buttons">
      <button class="banner__button-outline">Print receipt</button>
      <button class="banner__button-filled">Add to calendar</button>
    </div>
    <div>
    </div>
  </section>
</body>
<script src="./scripts/header.js"></script>
</html>
